plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// The AdMob app the manifest names, in every build.
//
// Ads are mediated by Appodeal. Its AdMob adapter brings the Google Mobile Ads
// SDK, which crashes at launch without an app ID, and Appodeal's consent
// manager finds the app's consent messages under this ID. Development builds
// name the real app too: Google's sample ID has no consent messages, so the
// form could never be tested, and test ads come from Appodeal's test mode,
// decided in code, not from this ID.
def admobAppId = 'ca-app-pub-4210665095499726~4296169317'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.genrevibes.whatsappstorysaver"
    compileSdk 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    // Release builds skip Android lint. It runs once per plugin module, took
    // hours and ran Gradle out of memory on an 8 GB Mac. Run lint from Android
    // Studio when you want it.
    lint {
        checkReleaseBuilds false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.genrevibes.whatsappstorysaver"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
        manifestPlaceholders += [admobAppId: admobAppId]
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation("androidx.multidex:multidex:2.0.1")

    // Networks Appodeal mediates. The plugin brings Appodeal core and its IAB
    // adapter only; a network serves nothing unless its adapter is here and it
    // is enabled in the Appodeal dashboard. Versions are the ones published
    // for stack_appodeal_flutter 4.2.0 and move with the plugin. Every adapter
    // adds app size, so trim this to the networks the dashboard uses.
    // Appodeal's analytics adapters (Adjust, AppsFlyer, Facebook, Firebase,
    // Sentry) are left out: the app reports ad revenue itself.
    // Commented out on 17 September 2026: no account for these in the Appodeal
    // dashboard (Mediation Setup > Ad Networks), so they cannot serve. Kept as
    // comments, not deleted: restoring a network is then a one-line edit plus a
    // release. applovin_max and level_play belong to the dashboard's MAX and
    // LevelPlay tabs; uncomment them if accounts appear there. bidmachine and
    // bidon stay in the build: Appodeal ships them as its own demand.
    implementation "com.appodeal.ads.sdk.adapters:admob:24.7.0.0"
    implementation "com.appodeal.ads.sdk.adapters:amazon:11.3.0.0"
    implementation "com.appodeal.ads.sdk.adapters:applovin:13.5.1.0"
    // implementation "com.appodeal.ads.sdk.adapters:applovin_max:13.5.1.1"
    implementation "com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0"
    implementation "com.appodeal.ads.sdk.adapters:bidon:0.14.0.0"
    implementation "com.appodeal.ads.sdk.adapters:bigo_ads:5.6.2.0"
    // implementation "com.appodeal.ads.sdk.adapters:chartboost:9.10.2.0"
    implementation "com.appodeal.ads.sdk.adapters:dt_exchange:8.4.1.0"
    implementation "com.appodeal.ads.sdk.adapters:inmobi:11.1.0.0"
    implementation "com.appodeal.ads.sdk.adapters:ironsource:9.1.0.0"
    // implementation "com.appodeal.ads.sdk.adapters:level_play:9.1.0.0"
    implementation "com.appodeal.ads.sdk.adapters:meta:6.21.0.0"
    implementation "com.appodeal.ads.sdk.adapters:mintegral:17.1.61.0"
    // implementation "com.appodeal.ads.sdk.adapters:mobilefuse:1.9.3.0"
    // implementation "com.appodeal.ads.sdk.adapters:moloco:4.3.1.0"
    implementation "com.appodeal.ads.sdk.adapters:my_target:5.47.1.0"
    // implementation "com.appodeal.ads.sdk.adapters:ogury:6.2.0.0"
    // implementation "com.appodeal.ads.sdk.adapters:pubmatic:4.10.0.0"
    // implementation "com.appodeal.ads.sdk.adapters:smaato:22.7.2.0"
    // implementation "com.appodeal.ads.sdk.adapters:startio:5.2.4.0"
    // implementation "com.appodeal.ads.sdk.adapters:taurusx:1.12.2.0"
    implementation "com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0"
    // implementation "com.appodeal.ads.sdk.adapters:verve:3.7.1.0"
    implementation "com.appodeal.ads.sdk.adapters:vungle:7.6.1.0"
    implementation "com.appodeal.ads.sdk.adapters:yandex:7.17.0.0"
}

flutter {
    source = "../.."
}


