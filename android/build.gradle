allprojects {
    repositories {
        google {
            content {
                excludeGroupByRegex 'com\\.appodeal(\\..*)?'
            }
        }
        mavenCentral {
            content {
                excludeGroupByRegex 'com\\.appodeal(\\..*)?'
            }
        }
        // Appodeal and the network adapters it mediates.
        maven { url "https://artifactory.appodeal.com/appodeal" }
    }
}

// Legacy plugins may read this value. Android and Kotlin plugin dependencies
// are already declared in settings.gradle; do not resolve them again here.
ext.kotlin_version = '2.2.20'

