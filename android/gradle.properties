# 4G: merging the dex of Appodeal's network adapters runs out of memory at 2G.
# Reclaim unused heap after long gaps without GC while retaining the warm JVM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:G1PeriodicGCInterval=60000 -XX:+G1PeriodicGCInvokesConcurrent
# Without this the Kotlin daemon inherits the 4G above, too much beside Gradle
# on an 8 GB machine.
kotlin.daemon.jvmargs=-Xmx2G
# Reuse Gradle between runs to avoid JVM startup and repeated setup work.
org.gradle.daemon=true
# Keep the warm daemon across normal coding breaks; release it after 30 minutes.
org.gradle.daemon.idletimeout=1800000
# Reuse eligible task outputs and dependency transforms from earlier builds.
org.gradle.caching=true
# Keep concurrent work bounded to avoid increasing peak memory usage.
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# TEST ONLY: undocumented, experimental AGP switch that makes R8 fully process
# only part of the app, to see whether R8 then fits in memory. Not verified for
# a Play Store release: remove it if the build fails or the app misbehaves.
# TEST: uncomment both lines below to go back to partial shrinking,
# and uncomment the placeholder block at the end of app/build.gradle too.
#android.experimental.gradual.r8=true
# Required by the switch above ("Partial shrinking only supports optimized
# resource shrinking"). AGP 8.11.1's name for Google's
# android.r8.optimizedResourceShrinking, which AGP 8.12 renamed.
#android.r8.optimizedShrinking=true
